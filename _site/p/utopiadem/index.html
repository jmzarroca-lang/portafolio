<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utopía Deportivo Eduardo Molina — zarroca</title>
  <meta name="description" content="Desarrollo ejecutivo de proyecto de obra pública para el Deportivo Eduardo Molina en Ciudad de México.">

  <!-- Open Graph (para compartir en redes) -->
  <meta property="og:title" content="Utopía Deportivo Eduardo Molina — zarroca">
  <meta property="og:description" content="Desarrollo ejecutivo de proyecto de obra pública para el Deportivo Eduardo Molina en Ciudad de México.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://localhost:4000/p/utopiadem/">
  
  <meta property="og:image" content="http://localhost:4000/assets/images/proyectos/05_UTOPIADEM/1.jpg">
  

  <!-- Favicon -->
  <link rel="icon" href="/assets/images/icons/LOGO BOLA.png" type="image/png">

  <!-- Estilos -->
  <link rel="stylesheet" href="/assets/css/main.css">
  
</head>
<body class="">

  <div class="site-header">
  <div class="site-header__inner">

    <!-- Logo izquierda -->
    <div class="site-header__logo-wrap">
      <a href="/" class="site-header__logo-text">zarroca</a>
    </div>

    <!-- Nav derecha (desktop) -->
    <div class="site-header__nav" id="shortcuts">
      <a href="/archivo" class="nav project-a" >
        <span class="a-span">Archivo</span>
      </a>
      <a href="/perfil" class="nav project-a" >
        <span class="a-span">Perfil</span>
      </a>
      <a href="/contacto" class="nav project-a" >
        <span class="a-span">Contacto</span>
      </a>
      <img src="/assets/images/icons/LOGO BOLA.png" alt="Inicio" class="site-header__bola">
    </div>

    <!-- Botón menú móvil -->
    <img id="mobile-menu-t" src="/assets/images/icons/botonflecha.png" alt="Abrir menú" class="mobile-menu-btn">
    <img id="mobile-menu-c" src="/assets/images/icons/botontache.png" alt="Cerrar menú" class="mobile-menu-btn" style="display: none;">

  </div>

  <!-- Menú móvil desplegable -->
  <div id="menu" class="mobile-menu" style="display: none;">
    <a href="/archivo" class="nav-mobile">Archivo</a>
    <a href="/perfil" class="nav-mobile">Perfil</a>
    <a href="/contacto" class="nav-mobile">Contacto</a>
  </div>
</div>


  <main class="page-content">
    <div class="proyecto-wrapper">
  <aside class="proyecto-sidebar">
    <h1 class="proyecto-titulo-grande u-mayus">DEPORTE Y CIUDAD</h1>
    <div class="proyecto-meta">
      <span class="proyecto-meta__nombre u-rojo">Utopía Deportivo Eduardo Molina</span>
      <span class="proyecto-meta__tipo u-rojo">Espacio público</span>
      <span class="proyecto-meta__año u-rojo">2025</span>
    </div>
    
    <div class="proyecto-colaboradores">
      
      <span class="u-rojo">José María Zarroca</span>
      
    </div>
    
    
  </aside>

  <div class="proyecto-scroll" id="proyecto-scroll">
    <div class="proyecto-bloque proyecto-bloque--texto">
      <p>Texto del proyecto por añadir.</p>

    </div>

    
    <div class="proyecto-galeria">
      
      <div class="proyecto-galeria__item size-normal">
        <img
          src="/assets/images/proyectos/05_UTOPIADEM/1.jpg"
          alt="Render del deportivo"
          loading="lazy"
        >
      </div>
      
      <div class="proyecto-galeria__item size-pequeño">
        <img
          src="/assets/images/proyectos/05_UTOPIADEM/2.jpg"
          alt="Planta de conjunto"
          loading="lazy"
        >
      </div>
      
      <div class="proyecto-galeria__item size-normal">
        <img
          src="/assets/images/proyectos/05_UTOPIADEM/3.jpg"
          alt="Vista del espacio público"
          loading="lazy"
        >
      </div>
      
    </div>
    
  </div>

  <div class="proyecto-progreso">
    <div class="proyecto-progreso__barra" id="barra-progreso"></div>
  </div>
</div>

  </main>

  <!-- JS global -->
  <script src="/assets/js/main.js"></script>
  

  <!-- Menú móvil -->
  <script>
    var btnAbrir = document.getElementById('mobile-menu-t');
    var btnCerrar = document.getElementById('mobile-menu-c');
    var menu = document.getElementById('menu');
    if (btnAbrir) {
      btnAbrir.addEventListener('click', function() {
        menu.style.display = 'block';
        btnCerrar.style.display = 'block';
        btnAbrir.style.display = 'none';
      });
      btnCerrar.addEventListener('click', function() {
        menu.style.display = 'none';
        btnCerrar.style.display = 'none';
        btnAbrir.style.display = 'block';
      });
    }
  </script>

</body>
</html>
